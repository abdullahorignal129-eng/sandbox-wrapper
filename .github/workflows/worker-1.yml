name: Worker 1

on:
  workflow_dispatch:

concurrency:
  group: worker-1
  cancel-in-progress: false

jobs:
  worker:
    runs-on: windows-2025   # PINNED - do not use windows-latest
    timeout-minutes: 360
    env:
      WORKER_ID: 1
      WINDOWS_PYTHON_VERSIONS: "3.11.9,3.12.10,3.13.15,3.14.7"
      WINDOWS_OS_VERSION: "windows-2025"
      RUNNER_LABEL: "windows-2025"
      COORDINATOR_URL: ${{ secrets.COORDINATOR_URL }}
      GITHUB_SHARED_SECRET: ${{ secrets.GITHUB_SHARED_SECRET }}
      WORKFLOW_TRIGGER_PAT: ${{ secrets.WORKFLOW_TRIGGER_PAT }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install agent dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Windows Sandbox availability
        shell: pwsh
        run: |
          python -c "import windows_runner; print('sandbox_available:', windows_runner.check_sandbox_available())"

      - name: Run worker agent
        shell: pwsh
        run: |
          python agent.py --worker-id ${{ env.WORKER_ID }} --coordinator-url ${{ secrets.COORDINATOR_URL }} --workflow-name worker-1.yml
