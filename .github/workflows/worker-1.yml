name: Worker 1

on:
  schedule:
    - cron: '0 */5 * * *'   # every 5 hours
  workflow_dispatch:

concurrency:
  group: worker-1
  cancel-in-progress: false

jobs:
  worker:
    runs-on: windows-2025   # PINNED
    timeout-minutes: 360
    env:
      WORKER_ID: 1
      WINDOWS_PYTHON_VERSIONS: "3.11.9,3.12.10,3.13.15,3.14.7"
      WINDOWS_OS_VERSION: "windows-2025"
      RUNNER_LABEL: "windows-2025"
      COORDINATOR_URL: ${{ secrets.COORDINATOR_URL }}
      GITHUB_SHARED_SECRET: ${{ secrets.GITHUB_SHARED_SECRET }}
      STOP_POLLING_AFTER_SECONDS: "17700"   # 4h55m

    steps:
      - uses: actions/checkout@v4

      # Install all required Python versions (they go into the tool cache)
      - name: Install Python 3.11.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'

      - name: Install Python 3.12.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'

      - name: Install Python 3.13.15
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'

      - name: Install Python 3.14.7
        uses: actions/setup-python@v5
        with:
          python-version: '3.14.7'

      # Install agent dependencies (httpx, etc.) using default Python
      - name: Install agent dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r sandbox_wrapper/requirements.txt

      # Run the worker agent
      - name: Run worker agent
        shell: pwsh
        run: |
          python sandbox_wrapper/agent.py --worker-id ${{ env.WORKER_ID }} --coordinator-url ${{ secrets.COORDINATOR_URL }}
