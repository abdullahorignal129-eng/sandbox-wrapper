name: Coordinator Keepalive

on:
  schedule:
    - cron: '0 */2 * * *'   # every 2 hours
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install keepalive dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r sandbox_wrapper/requirements.txt

      - name: Run keepalive ping
        env:
          COORDINATOR_URL: ${{ secrets.COORDINATOR_URL }}
          GITHUB_SHARED_SECRET: ${{ secrets.GITHUB_SHARED_SECRET }}
        run: python sandbox_wrapper/keepalive.py
