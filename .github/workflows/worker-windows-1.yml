name: Worker 1 (Windows)

on:
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:

jobs:
  worker:
    runs-on: windows-2025
    timeout-minutes: 360
    env:
      WORKER_ID: 1
      WINDOWS_PYTHON_VERSIONS: "3.11.9,3.12.10,3.13.15,3.14.7"
      WINDOWS_OS_VERSION: "windows-2025"
      RUNNER_LABEL: "windows-2025"
      COORDINATOR_URL: ${{ secrets.COORDINATOR_URL }}
      GITHUB_SHARED_SECRET: ${{ secrets.GH_SHARED_SECRET }}
      STOP_POLLING_AFTER_SECONDS: "17700"

    steps:
      - uses: actions/checkout@v4

      - name: Install Python 3.11.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'

      - name: Install Python 3.12.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'

      - name: Install Python 3.13.15
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'

      - name: Install Python 3.14.7
        uses: actions/setup-python@v5
        with:
          python-version: '3.14.7'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r sandbox_wrapper/requirements.txt

      - name: Print system resources
        shell: pwsh
        run: |
          python -c "import os, psutil; print('CPU cores:', os.cpu_count(), 'RAM GB:', round(psutil.virtual_memory().total/1e9, 2))"

      - name: Run worker agent
        shell: pwsh
        run: |
          python sandbox_wrapper/agent.py --worker-id ${{ env.WORKER_ID }} --coordinator-url ${{ secrets.COORDINATOR_URL }}
